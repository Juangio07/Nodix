<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodix | Configuración</title>
  <link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../../../Shared/Css/Variables.css"><link rel="stylesheet" href="../../../Shared/Css/Global.css"><link rel="stylesheet" href="Configuracion.css">
  <script defer src="../../../Shared/Config/AppConfig.js"></script><script defer src="../../../Shared/Config/FixelarGlobal.js"></script>
</head>
<body>
  <main class="config-page">
    <header class="module-header"><div><span class="eyebrow"><i class="fa-solid fa-sliders" aria-hidden="true"></i> IDENTIDAD DEL NEGOCIO</span><h1>Configuración</h1><p>Administra la información que identifica tu empresa dentro de Nodix.</p></div></header>
    <section class="config-card"><div class="card-head"><div><span class="section-kicker">PERFIL DE EMPRESA</span><h2>Información principal</h2><p>Estos datos se reflejan en la operación y en el espacio activo.</p></div><div class="saved-indicator" id="savedIndicator"><i class="fa-solid fa-check" aria-hidden="true"></i> Guardado</div></div>
      <form id="companyForm" novalidate><div class="config-layout"><div class="logo-column"><div class="logo-preview" id="logoPreview"><span id="logoInitial">N</span><img id="logoImage" alt="Logo de la empresa" hidden></div><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><button class="secondary-button" id="uploadLogo" type="button"><i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i> Cargar logo</button><button class="remove-button" id="removeLogo" type="button" hidden>Quitar logo</button><small>PNG, JPG o WEBP · opcional</small></div><div class="fields-grid"><label><span>NIT/CC <b>*</b></span><input id="nit" name="nit" type="text" required placeholder="Número de identificación"></label><label><span>Nombre <b>*</b></span><input id="nombre" name="nombre" type="text" required placeholder="Nombre de la empresa"></label><label><span>Propietario <b>*</b></span><input id="propietario" name="propietario" type="text" required placeholder="Nombre del propietario"></label><label><span>Teléfono <b>*</b></span><input id="telefono" name="telefono" type="tel" required placeholder="Teléfono de contacto"></label><label><span>Correo <b>*</b></span><input id="correo" name="correo" type="email" required placeholder="correo@empresa.com"></label><label class="field-wide"><span>Ubicación <b>*</b></span><input id="ubicacion" name="ubicacion" type="text" required placeholder="Ciudad o dirección del negocio"></label></div></div><p class="form-message" id="formMessage" role="alert"></p><div class="form-actions"><button class="primary-button" type="submit"><i class="fa-solid fa-check" aria-hidden="true"></i> Guardar cambios</button></div></form>
    </section>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="Configuracion.js"></script>
</body>
</html>
